name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.api.yml config --quiet
          VITE_API_BASE_URL=https://api.example docker compose -f frontend/compose.yaml config --quiet
          python tests/docker/check_load_isolation.py
          python tests/docker/check_local_frontend_proxy.py
          python tests/docker/check_local_container_hardening.py

      - name: Build frontend validation image
        run: docker build --target build -f frontend/Dockerfile -t climaprev-frontend-checks:ci frontend

      - name: Run frontend lint and tests
        run: |
          docker run --rm climaprev-frontend-checks:ci npm run lint
          docker run --rm climaprev-frontend-checks:ci npm test

      - name: Audit frontend dependencies
        run: docker run --rm climaprev-frontend-checks:ci npm audit --audit-level=high

      - name: Build application image
        run: docker compose build app

      - name: Run test suite
        run: docker compose run --rm app pytest -q -W error

      - name: Run Ruff
        run: docker compose run --rm app ruff check src tests --ignore EXE002

      - name: Run mypy
        run: docker compose run --rm app mypy src

      - name: Validate production package isolation
        run: |
          docker build --target runtime -t climaprev-runtime:ci .
          docker run --rm -v "$PWD/tests/docker/check_runtime_image.py:/check.py:ro" climaprev-runtime:ci python /check.py

      - name: Start application and frontend
        run: docker compose up -d app frontend

      - name: Validate Nginx configuration
        run: docker compose exec -T frontend nginx -t

      - name: Smoke test frontend and API health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-connrefused http://127.0.0.1:8080/health/live
          python tests/docker/check_frontend_security.py \
            --base-url http://127.0.0.1:8080

      - name: Stop Compose services
        if: always()
        run: docker compose down -v --remove-orphans

  decoupling:
    name: Independent frontend and API over HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build API test image
        run: docker compose -f tests/docker/decoupling/compose.yaml build api
      - name: Provision isolated test TLS
        run: |
          mkdir -p .homolog/decoupling
          chmod 700 .homolog/decoupling
          python docker/homolog/entrada/provision_tls.py .homolog/decoupling
      - name: Start independent HTTPS origins
        run: docker compose -f tests/docker/decoupling/compose.yaml up -d --build --wait
      - name: Install locked browser runner
        run: |
          npm ci --ignore-scripts --prefix tests/docker/decoupling
          node tests/docker/decoupling/node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate actual cross-origin browser flow
        id: browser
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tests/docker/decoupling/node_modules/playwright/index.mjs
        run: node tests/docker/check_decoupled_browser.mjs
      - name: Save browser evidence
        if: steps.browser.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoupling-browser-evidence
          path: docs/operacoes/evidence/desacoplamento-browser-2026-10-20.json
          if-no-files-found: ignore
      - name: Stop isolated test services
        if: always()
        run: docker compose -f tests/docker/decoupling/compose.yaml down -v --remove-orphans
