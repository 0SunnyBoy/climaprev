name: climaprev-decoupling
services:
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 10
  provider:
    image: climaprev-develop-app:latest
    command: [uvicorn, tests.load.mock_provider:app, --host, 0.0.0.0, --port, '8080']
  api:
    image: climaprev-develop-app:latest
    volumes:
      - ../../../src:/app/src:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      CLIMAPREV_ENVIRONMENT: load
      CLIMAPREV_ALLOWED_HOSTS: localhost,api
      CLIMAPREV_CORS_ALLOW_ORIGINS: https://localhost:8445
      CLIMAPREV_PROVIDER_ALLOWED_HOSTS: provider
      CLIMAPREV_GEOCODING_BASE_URL: http://provider:8080
      CLIMAPREV_FORECAST_BASE_URL: http://provider:8080
      CLIMAPREV_INMET_ALERTS_BASE_URL: http://provider:8080
      CLIMAPREV_RATE_LIMIT: '8'
      CLIMAPREV_RATE_LIMIT_BURST: '8'
      CLIMAPREV_RATE_LIMIT_WINDOW_SECONDS: '60'
      CLIMAPREV_CONNECT_TIMEOUT_SECONDS: '1'
      CLIMAPREV_READ_TIMEOUT_SECONDS: '2'
      CLIMAPREV_ADDITIONAL_RETRIES: '0'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, climaprev.healthcheck]
      interval: 1s
      timeout: 2s
      retries: 20
  web:
    build:
      context: ../../../frontend
      args:
        VITE_API_BASE_URL: https://localhost:8446
    image: climaprev-frontend:decoupling-e2e
  tls:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../.homolog/decoupling/server.crt:/cert/server.crt:ro
      - ../../../.homolog/decoupling/server.key:/cert/server.key:ro
    ports:
      - '127.0.0.1:8445:443'
      - '127.0.0.1:8446:444'
      - '127.0.0.1:8447:443'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
