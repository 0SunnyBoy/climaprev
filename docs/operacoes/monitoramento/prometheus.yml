global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/climaprev-alerts.yml
scrape_configs:
  - job_name: climaprev
    metrics_path: /internal/metrics/prometheus
    scrape_timeout: 3s
    static_configs:
      - targets: ['app:8000']
# Private network only. Enable CLIMAPREV_METRICS_AGGREGATION_ENABLED on each API worker.
# Store TSDB on its own volume; set --storage.tsdb.retention.time=30d in the collector.
# Alertmanager destination and operational owners must be chosen before production.
