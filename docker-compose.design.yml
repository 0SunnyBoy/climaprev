services:
  frontend-dev:
    image: node:22-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-dev-node-modules:/app/node_modules
    command: sh -c "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - edge
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  frontend-dev-node-modules:
