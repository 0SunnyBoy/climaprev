events {}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;

    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;

        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location = /docs { return 404; }
        location ^~ /docs/ { return 404; }
        location = /redoc { return 404; }
        location ^~ /redoc/ { return 404; }
        location = /openapi.json { return 404; }

        location ~ ^/assets/(styles\.css|app\.js|api\.js|result\.js)$ {
            alias /usr/share/nginx/html/$1;
            expires 1h;
        }

        location = / {
            expires -1;
            try_files /index.html =404;
        }

        location = /api/v1/risk {
            limit_except GET POST { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/locations/search {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/live {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health/ready {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / { return 404; }
    }
}
