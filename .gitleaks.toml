# Keep all pinned default detection rules enabled.
# Exact verified public provider host and public SHA256 metadata values only.
# No path or rule is excluded; synthetic credentials remain detectable.
[extend]
useDefault = true

[[allowlists]]
description = "Verified public canonical OpenAPI SHA256; not an authentication credential"
regexTarget = "secret"
regexes = [
  '''^dd96650a5d5b5157a1d49f095b21f10fbb7b2b337d74ca4183f30965f81c658f$''',
  '''^474199bf4155eec9bde52b4343e0aaed12888bee7315f9e87460b48efaac62fe$''',
]

[[allowlists]]
description = "Verified public metadata value 1; exact value only"
regexTarget = "secret"
regexes = ['''^apiprevmet3\.inmet\.gov\.br$''']

[[allowlists]]
description = "Verified public metadata value 2; exact value only"
