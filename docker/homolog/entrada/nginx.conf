pid /tmp/nginx.pid;
events {}
http {
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/mime.types;
    error_log /dev/null emerg;
    server_tokens off;
    map $uri $safe_route {
        default unmatched;
        / /;
        /api/v1/risk /api/v1/risk;
        /health/live /health/live;
        /health/ready /health/ready;
        ~^/assets/ /assets/*;
        ~^/internal /internal/*;
    }
    map $upstream_http_x_request_id $safe_request_id {
        default $request_id;
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $upstream_http_x_request_id;
    }
    log_format safe escape=json '{"event":"entry_completed","request_id":"$safe_request_id","route":"$safe_route","status":$status,"duration_seconds":$request_time}';
    access_log syslog:server=unix:/run/climaprev-logs/request.sock,tag=climaprev safe;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        root /usr/share/nginx/html;
        client_max_body_size 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;

        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1h;
        }

        location = / {
            try_files /index.html =404;
        }

        location = /api/v1/risk {
            limit_except GET POST { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/v1/locations/search {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /health/live {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /health/ready {
            limit_except GET { deny all; }
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / { return 404; }
    }
}
